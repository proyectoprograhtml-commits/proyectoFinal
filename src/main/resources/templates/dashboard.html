<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(title=~{::title}, content=~{::#content})}">
    <head>
        <title>Dashboard</title>
    </head>
    <body>
        <div id="content">
            <div class="container"> 
                <h1>Bienvenido a tu Panel de Control</h1>

                <div th:if="${notificacionCita != null}" style="border: 2px solid orange; padding: 15px; background-color: #fff3e0;">
                    <h2>⚠️ Recordatorio de Cita Próxima</h2>
                    <p>Tienes una sesión de terapia programada en breve:</p>
                    <p><strong>Fecha y Hora:</strong> 
                        <span th:text="${#temporals.format(notificacionCita.fechaHora, 'dd-MM-yyyy HH:mm')}"></span>
                    </p>
                </div>

                <hr/>

                <h2>Mis citas</h2>

                <!-- Mensaje si no hay citas -->
                <div th:if="${#lists.isEmpty(citasPaciente)}">
                    <p>No tienes citas agendadas por el momento.</p>
                </div>

                <!-- Tabla de citas si existen -->
                <table class="table" th:if="${!#lists.isEmpty(citasPaciente)}">
                    <thead>
                        <tr>
                            <th>Fecha y hora</th>
                            <th>Terapeuta</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${citasPaciente}">
                            <td th:text="${#temporals.format(c.fechaHora, 'dd-MM-yyyy HH:mm')}">
                                01-01-2025 10:00
                            </td>
                            <td th:text="${c.terapeutaId}">1</td>
                            <td th:text="${c.estado}">Pendiente</td>
                        </tr>
                    </tbody>
                </table>


                <p>Explora <a th:href="@{/psicologos}">Terapeutas disponibles</a>.</p>
            </div>
        </div>
    </body>
</html>
